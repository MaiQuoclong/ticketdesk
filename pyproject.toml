[project]
name = "ticketdesk"
version = "0.1.0"
description = "Hệ thống tiếp nhận và xử lý yêu cầu hỗ trợ nội bộ (TicketDesk)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.7.0",
    "django>=5.1,<6.0",
    "django-environ>=0.11.2",
    "django-filter>=26.2",
    "django-unfold>=0.110.1",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "psycopg[binary]>=3.3.8",
    "redis>=8.2.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.2",
    "factory-boy>=3.3.3",
    "faker>=40.63.0",
    "mypy>=2.4.1",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.9.0",
    "ruff>=0.6.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-q --reuse-db"

[tool.coverage.run]
source = ["apps"]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/management/commands/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
mypy_path = "."
exclude = ["/migrations/"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["factory.*", "environ.*", "debug_toolbar.*", "unfold.*", "django_filters.*", "drf_spectacular.*", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["apps.*.tests.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"
