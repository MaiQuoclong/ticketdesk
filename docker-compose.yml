# Môi trường dev: chỉ chạy PostgreSQL. App Django chạy trên máy bằng uv.
services:
  db:
    image: postgres:16-alpine
    container_name: ticketdesk-db
    environment:
      POSTGRES_DB: ticketdesk
      POSTGRES_USER: ticketdesk
      POSTGRES_PASSWORD: ticketdesk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketdesk -d ticketdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
